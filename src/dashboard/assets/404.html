<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 // BRIDGE</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #050505;
            color: #F5F5F5;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
            padding: 20px;
        }
        .wordmark {
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.14em;
            color: #737373;
            margin-bottom: 48px;
        }
        .wordmark::after {
            content: "";
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #F38020;
            margin-left: 6px;
            vertical-align: 2px;
        }
        .code {
            font-size: 72px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 0.04em;
        }
        .code span { color: #F38020; }
        .message {
            color: #A3A3A3;
            font-size: 15px;
            margin: 18px 0 32px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 7px 16px;
            border-radius: 4px;
            border: 1px solid #222;
            background: #101010;
            color: #F5F5F5;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.1s ease, border-color 0.1s ease;
        }
        .btn:hover { background: #151515; border-color: #2E2E2E; }
        .hint {
            margin-top: 40px;
            color: #737373;
            font-size: 12px;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }
    </style>
</head>
<body>
    <div class="wordmark">BRIDGE</div>
    <div class="code">4<span>0</span>4</div>
    <div class="message">The route you're looking for does not exist.</div>
    <a class="btn" href="/">Back to Overview</a>
    <div class="hint">bridgemesh.space</div>
</body>
</html>
