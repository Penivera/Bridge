<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRIDGE // Fleet Control</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
    <noscript>
        <div class="noscript-banner">
            BRIDGE Dashboard requires JavaScript to be enabled. The daemon API is available at <code>/api/v1/</code>.
        </div>
    </noscript>

    <div class="app-layout">
        <nav class="sidebar" id="sidebar" aria-label="Primary">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <img class="brand-mark" src="/favicon.png" alt="" aria-hidden="true">
                    <div>
                        <div class="wordmark">BRIDGE</div>
                        <div class="brand-sub">Distributed ingress infrastructure</div>
                    </div>
                </div>
                <button class="sidebar-close" id="sidebar-close" aria-label="Close navigation">&times;</button>
            </div>

            <div class="sidebar-nav">
                <a href="#/overview" data-view="overview" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
                    <span class="nav-label">Overview</span>
                </a>

                <div class="nav-group">Infrastructure</div>
                <a href="#/nodes" data-view="nodes" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                    <span class="nav-label">Nodes</span>
                </a>
                <a href="#/mesh" data-view="mesh" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                    <span class="nav-label">Mesh</span>
                </a>
                <a href="#/routes" data-view="routes" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/></svg>
                    <span class="nav-label">Routes</span>
                </a>

                <div class="nav-group">Traffic</div>
                <a href="#/requests" data-view="requests" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                    <span class="nav-label">Requests</span>
                </a>
                <a href="#/backends" data-view="backends" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
                    <span class="nav-label">Backends</span>
                </a>
                <a href="#/proxy" data-view="proxy" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                    <span class="nav-label">Proxy</span>
                </a>

                <div class="nav-group">Operations</div>
                <a href="#/handoffs" data-view="handoffs" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                    <span class="nav-label">Handoffs</span>
                </a>
                <a href="#/events" data-view="events" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                    <span class="nav-label">Events</span>
                </a>

                <div class="nav-group">Configuration</div>
                <a href="#/runtime" data-view="runtime" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
                    <span class="nav-label">Runtime</span>
                </a>
                <a href="#/cluster" data-view="cluster" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
                    <span class="nav-label">Cluster</span>
                </a>

                <div class="nav-group">System</div>
                <a href="#/logs" data-view="logs" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
                    <span class="nav-label">Logs</span>
                </a>
                <a href="#/health" data-view="health" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    <span class="nav-label">Health</span>
                </a>
            </div>

            <div class="sidebar-footer">
                <div class="sidebar-footer-row">
                    <span class="muted">Daemon</span>
                    <span id="version-display" class="mono muted">v?.?.?</span>
                </div>
                <div class="sidebar-footer-row">
                    <span class="muted">Uptime</span>
                    <span id="uptime-display" class="mono muted">—</span>
                </div>
            </div>
        </nav>
        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <div class="main-area">
            <header class="topbar">
                <div class="topbar-left">
                    <button class="hamburger" id="sidebar-toggle" aria-label="Open navigation">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <span class="topbar-wordmark">BRIDGE</span>
                    <span class="topbar-sep">/</span>
                    <span id="topbar-section" class="topbar-section">Overview</span>
                </div>
                <div class="topbar-right">
                    <div class="topbar-meta" title="Realtime event stream">
                        <span class="meta-label">Realtime</span>
                        <span id="realtime-indicator" class="realtime realtime--down">
                            <span class="status-dot status-dot--warning"></span><span id="realtime-text">Reconnecting</span>
                        </span>
                    </div>
                    <div class="topbar-meta" title="Local node identity">
                        <span id="node-identity" class="mono meta-value">—</span>
                    </div>
                    <div class="topbar-meta topbar-leader" title="Current cluster leader">
                        <span class="meta-label">Leader</span>
                        <span id="leader-display" class="mono meta-value">—</span>
                    </div>
                    <div id="health-pill" class="health-pill" title="Cluster health">
                        <span class="status-dot"></span><span class="health-pill-text">Loading</span>
                    </div>
                    <div class="topbar-meta" id="session-meta" title="Authenticated dashboard session" style="display:none">
                        <span class="meta-label">User</span>
                        <span id="session-user" class="mono meta-value">—</span>
                        <button class="logout-btn" id="logout-btn" type="button" title="Sign out">Sign out</button>
                    </div>
                </div>
            </header>

            <main id="content" class="content" tabindex="-1">
                <div class="skeleton skeleton--panel" style="height: 96px;"></div>
                <div class="skeleton skeleton--panel" style="height: 280px;"></div>
                <div class="skeleton skeleton--panel" style="height: 200px;"></div>
            </main>
        </div>
    </div>

    <div id="drawer-root"></div>
    <div id="modal-root"></div>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="/assets/api.js" defer></script>
    <script src="/assets/views/overview.js" defer></script>
    <script src="/assets/views/nodes.js" defer></script>
    <script src="/assets/views/mesh.js" defer></script>
    <script src="/assets/views/routes.js" defer></script>
    <script src="/assets/views/requests.js" defer></script>
    <script src="/assets/views/backends.js" defer></script>
    <script src="/assets/views/proxy.js" defer></script>
    <script src="/assets/views/handoffs.js" defer></script>
    <script src="/assets/views/events.js" defer></script>
    <script src="/assets/views/config.js" defer></script>
    <script src="/assets/views/cluster.js" defer></script>
    <script src="/assets/views/logs.js" defer></script>
    <script src="/assets/views/health.js" defer></script>
    <script src="/assets/app.js" defer></script>
</body>
</html>
