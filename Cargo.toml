[package]
name = "bridge"
version = "0.1.0"
edition = "2024"
default-run = "bridge"

[workspace]
members = ["cluster", "mesh", "proxy", "registry"]
resolver = "2"

[workspace.dependencies]
cluster = { path = "cluster" }
mesh = { path = "mesh" }
proxy = { path = "proxy" }
registry = { path = "registry" }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
toml = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
smart-default = "0.7.1"
url = { version = "2.5.8", features = ["serde"] }
tracing-subscriber = {version ="0.3.23", features = ["env-filter", "fmt","ansi"]}
sentry = { version = "0.36", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "reqwest", "rustls"] }
sentry-tracing = "0.36"
serde_yaml = "0.9.34"
serde_json = "1.0.140"
bollard = "0.21.1"
futures-util = "0.3.31"
bincode = "1.3"
base64 = "0.22"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
rand = "0.10"
foca = { version = "2.0.0", features = ["serde", "tracing", "postcard-codec"] }
defguard_wireguard_rs = "0.12.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
cluster = { workspace = true }
mesh = { workspace = true }
proxy = { workspace = true }
registry = { workspace = true }
reqwest = { workspace = true }
sentry = { workspace = true }
sentry-tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
smart-default = { workspace = true }
tokio = { workspace = true }
toml = {workspace = true}
tracing = { workspace = true }
url = { workspace = true }
tracing-subscriber = {workspace = true}
bollard = { workspace = true }
futures-util = { workspace = true }
bincode = { workspace = true }
base64 = { workspace = true }
x25519-dalek = { workspace = true }
rand = { workspace = true }
foca = { workspace = true }
thiserror = "2"
axum = { version = "0.8", features = ["ws"], optional = true }
tower-http = { version = "0.6", features = ["timeout"], optional = true }
argon2 = "0.6.0"
rpassword = "7.5.4"

[features]
default = ["dashboard"]
dashboard = ["dep:axum", "dep:tower-http"]


[[bin]]
name = "bridge"
path = "src/main.rs"

[[bin]]
name = "demo-autoscaling"
path = "src/bin/demo_autoscaling.rs"
