enable_telemetry = false

[sentry]
dsn = ""
environment = "development"
sample_rate = 1.0
traces_sample_rate = 0.0
debug = false

[logger]
level = "DEBUG"
format = "text"
target = "stderr"
ansi = true

[proxy]
mode = "Direct"
listeners = ["http"]
redirect_http = false

# Dashboard authentication (demo credentials: admin / admin)
[auth]
enabled = true

[[auth.users]]
username = "admin"
password_hash = "$argon2id$v=19$m=65536,t=3,p=4$/Mw9sKec3sw52cQ9ezflnw$ELTH8lIYx6+26WGPFwuXFMbxZwIS+eKeC+AssoykWAQ"

# Target nodes (WireGuard endpoints or target backends)
[[nodes]]
node_id = "httpbin-aws"
endpoint = "3.234.68.252:443"

[[nodes]]
node_id = "self"
endpoint = "127.0.0.1:80"

# Domain-to-node routing
[[services]]
url = "https://httpbin.org"
node_id = "httpbin-aws"

[[services]]
url = "http://cafx.test"
node_id = "self"
upstream = "127.0.0.1:8080"

[[services]]
url = "https://random.test"
node_id = "self"
upstream = "127.0.0.1:8000"
