name: Release

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        uses: cross-rs/cross@v0.2.5
        with:
          command: build
          args: --release --target ${{ matrix.target }}

      - name: Package binary
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          TAG="v${VERSION}-${GITHUB_SHA::8}"
          ASSET="bridge-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/bridge" dist/bridge
          cp LICENSE dist/LICENSE
          cp scripts/install.sh dist/install.sh
          tar -C dist -czf "$ASSET" bridge LICENSE install.sh
          sha256sum "$ASSET" | tee "$ASSET.sha256"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.target }}
          path: |
            bridge-*.tar.gz
            bridge-*.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          TAG="v${VERSION}-${GITHUB_SHA::8}"
          cd artifacts

          # Single checksum manifest covering every asset in the release.
          cat bridge-*.tar.gz.sha256 > sha256sums.txt

          cat > notes.md <<'EOF'
          Automated release from push to `main` (commit ${GITHUB_SHA}).

          Static musl binaries - run on virtually any Linux (glibc or musl), no shared library dependencies:
          - `x86_64-unknown-linux-musl` - Intel/AMD 64-bit
          - `aarch64-unknown-linux-musl` - ARM 64-bit (AWS Graviton, Raspberry Pi 4+, Ampere, etc.)

          Install with:
          ```sh
          curl -fsSL https://raw.githubusercontent.com/Penivera/Bridge/main/scripts/install.sh | sh
          ```
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; uploading assets"
            gh release upload "$TAG" bridge-*.tar.gz sha256sums.txt --clobber
          else
            gh release create "$TAG" \
              --target main \
              --title "BRIDGE v${VERSION} (build ${GITHUB_SHA::8})" \
              --notes-file notes.md \
              bridge-*.tar.gz sha256sums.txt
          fi
