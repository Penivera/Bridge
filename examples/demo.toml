# ==============================================================================
# BRIDGE — LIVE PRESENTATION & ARCHITECTURE DEMO CONFIGURATION
# ==============================================================================

enable_telemetry = false

[logger]
level = "INFO"
format = "text"
target = "stderr"
ansi = true

[proxy]
mode = "Handoff"
listeners = ["http", "https"]
redirect_http = false

# Embedded Real-Time Observability Web Dashboard (Phase 9)
[dashboard]
enabled = true
listen_addr = "127.0.0.1:9090"

# Dashboard authentication (demo credentials: admin / admin)
[auth]
enabled = true

[[auth.users]]
username = "admin"
password_hash = "$argon2id$v=19$m=65536,t=3,p=4$/Mw9sKec3sw52cQ9ezflnw$ELTH8lIYx6+26WGPFwuXFMbxZwIS+eKeC+AssoykWAQ"

# Unix Domain Socket IPC for Local CLI Control
[ipc]
enabled = true
socket_path = "/tmp/bridge.sock"

# Local Cluster Node Identity & WireGuard Mesh Configuration
[node]
id = "vm-01"
endpoint = "127.0.0.1:51820"
listen_port = 51820
mesh_ip = "10.8.0.1"
priority = 10

# Cluster Peers & Target Backends
[[nodes]]
id = "vm-01"
endpoint = "127.0.0.1:8081"
mesh_endpoint = "10.8.0.1:8081"

[[nodes]]
id = "vm-02"
endpoint = "127.0.0.1:8082"
mesh_endpoint = "10.8.0.2:8082"

[[nodes]]
id = "vm-03"
endpoint = "127.0.0.1:8083"
mesh_endpoint = "10.8.0.3:8083"

# ------------------------------------------------------------------------------
# Service 1: Multi-Target Consistent Hash Ring (Phase 8)
# Demonstrates 360 virtual nodes per physical backend & deterministic session affinity
# ------------------------------------------------------------------------------
[[services]]
url = "http://app.example.com"
node_id = "vm-01"
upstream = "127.0.0.1:8081"

[[services]]
url = "http://app.example.com"
node_id = "vm-02"
upstream = "127.0.0.1:8082"

# ------------------------------------------------------------------------------
# Service 2: Workload Failover & Duplication with Preemptive Failback (Cooldown)
# ------------------------------------------------------------------------------
[[services]]
url = "http://api.example.com"
node_id = "vm-02"
upstream = "127.0.0.1:8082"

[services.replicate]
enabled = true
image = "redis:alpine"
container_port = 6379
placement = "leader"
failback_mode = "preemptive"
failback_cooldown_secs = 10

# ------------------------------------------------------------------------------
# Service 3: Workload Failover with Manual Operator Failback
# ------------------------------------------------------------------------------
[[services]]
url = "http://billing.example.com"
node_id = "vm-03"
upstream = "127.0.0.1:8083"

[services.replicate]
enabled = true
image = "postgres:15-alpine"
container_port = 5432
placement = "ring"
failback_mode = "manual"
failback_cooldown_secs = 30
